<!--
  Legacy alias kept for the custom home/projects/blog listings.

  This used to be a Chirpy v4 snippet that relied on a `timeage.js` helper
  removed in v5+; without it the raw ISO date in <i class="unloaded"> was
  rendered visibly next to every card date. Delegate to the theme's own
  datetime.html instead, which formats via _data/locales df settings and is
  kept in sync by the theme's locale-datetime.js.
-->
{% include lang.html %}
{% include datetime.html date=include.date tooltip=include.tooltip class=include.class lang=lang %}
